services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: easypc-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - easypc-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: easypc-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - easypc-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: EasyPC.API/Dockerfile
    container_name: easypc-api
    restart: unless-stopped
    ports:
      - "5285:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EasyPC_RS2;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: admin
      RabbitMQ__Password: admin
      RabbitMQ__VirtualHost: /
      PayPal__ClientId: "AeYzFMPFZ7MjvjN2XXOwzDAAYLZNwYrU0S7w3pTt4_HyVxNldFc8BYWLK8L4sMNOjnmsbwk_N3RR98tM"
      PayPal__Secret: "EBiPbamHkHe7OH67LGN0YFioZWjScP8cW-M0JzfGYQG4Woqo9df2MTGaYh8T0wDVbPSVQ5S4C2pAxQMg"
      PayPal__Mode: "sandbox"
      Stripe__PublishableKey: "pk_test_51SoNsfE9HC0B2PBzUNrLYtaZh42OY8fetGVgNmh4pN6AXxBM6IOqYO7ssCgCMCC94c7EgpiOcaHaHhqYIXApO1Zx00W2KHxWkh"
      Stripe__SecretKey: "sk_test_51SoNsfE9HC0B2PBzTRVdUEi8IfoFBd7X6ra2ToB8VvF0IpSd4HH6hLXgaQ85UqTEEk55CbcXzP1zIjhmi6KQUkCe00wnDtOrKn"
      Stripe__WebhookSecret: "whsec_test_placeholder_for_local_testing"
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    networks:
      - easypc-network

  subscriber:
    build:
      context: .
      dockerfile: EasyPC.Subscriber/Dockerfile
    container_name: easypc-subscriber
    restart: unless-stopped
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: admin
      RabbitMQ__Password: admin
      RabbitMQ__VirtualHost: /
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: tt8915119@gmail.com
      SMTP_PASSWORD: pass12$$TEST22
      SMTP_ENABLE_SSL: true
      EMAIL_TEST_MODE: true
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - easypc-network

networks:
  easypc-network:
    driver: bridge

volumes:
  rabbitmq-data:
  sqlserver-data: